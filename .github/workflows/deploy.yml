# Deploy: GitHub Actions builds, GHCR stores, the VPS pulls.
# Platform contract: infra-setup/github-workflow/README.md.
#
# Pushing to master deploys. `workflow_dispatch` with a tag rolls back to an image
# that already exists, without building.
#
# Secrets required:
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   in the `vps` environment (master only)
#   VPS_HOST                               repository secret, the server's 100.x.y.z
#
# There is deliberately NO SSH key: the server runs Tailscale SSH and admits tag:ci
# by tailnet identity -- as the `deploy` user, which can do exactly one thing:
# run infra-setup's deploy-app.sh. This job sends docker-compose.prod.yml to it;
# the server checks the file against its deploy policy, then pulls, migrates
# (the `migrate` task in that file) and restarts.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Roll back to an existing image tag (a commit SHA). Leave empty to build and deploy this ref."
        required: false
        type: string

# One deploy at a time, never cancelled: a half-applied migration is worse than
# waiting for the run in front to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Must match the name passed to new-app.sh: container, compose project,
  # database and image name at once.
  APP_NAME: readledger
  APP_DIR: /srv/apps/readledger
  IMAGE: ghcr.io/${{ github.repository_owner }}/readledger
  PUBLIC_URL: https://readledger.app
  DEPLOY_TAG: ${{ inputs.tag || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Tailscale OAuth secrets live in the `vps` environment, not the
    # repository, and that environment only releases them to runs on master.
    # A workflow edited on a branch and started with workflow_dispatch gets
    # nothing to join the tailnet with.
    environment: vps
    timeout-minutes: 30

    steps:
      # DEPLOY_TAG ends up in a remote shell; only accept a commit SHA.
      - name: Validate the tag
        env:
          TAG: ${{ env.DEPLOY_TAG }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::tag must be a commit SHA"; exit 1; }

      - uses: actions/checkout@v4

      # Cheap gate before anything ships. Skipped for rollbacks, which redeploy
      # bytes that already passed.
      - if: ${{ !inputs.tag }}
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: ${{ !inputs.tag }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Unit tests
        if: ${{ !inputs.tag }}
        run: |
          pnpm install --frozen-lockfile
          DIRECT_URL=postgresql://ci@localhost/ci pnpm db:generate
          pnpm test:run

      - if: ${{ !inputs.tag }}
        uses: docker/setup-buildx-action@v3

      - if: ${{ !inputs.tag }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native amd64, same architecture as the VPS.
      - name: Build and push the image
        if: ${{ !inputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The action exits 0 even when `tailscale up` failed, which would surface
      # later as an unexplained SSH timeout. Fail here while the cause is visible.
      - name: Verify the tailnet join
        run: |
          if ! tailscale status; then
            echo "::error::Not on the tailnet. Check TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET."
            exit 1
          fi

      # accept-new is acceptable only because the connection rides inside
      # WireGuard between two authenticated tailnet peers.
      #
      # One command, with the compose file as its stdin. deploy-app.sh reads
      # all of stdin before it runs anything, so nothing on the server can eat
      # part of a script -- there is no script, only the file and the verb.
      # On failure it prints why (policy violation, failed migration, the
      # container's last log lines) and exits non-zero.
      - name: Deploy
        env:
          SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
        run: |
          ssh $SSH_OPTS "deploy@${{ secrets.VPS_HOST }}" \
            sudo -u hugo /srv/scripts/deploy-app.sh deploy "$APP_NAME" "$DEPLOY_TAG" \
            < docker-compose.prod.yml

      - name: Assert the app answers through Cloudflare
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${PUBLIC_URL}/health"
